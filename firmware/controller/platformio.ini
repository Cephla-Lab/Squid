[platformio]
src_dir = .
include_dir = src
test_dir = test

[env:teensy41]
platform = teensy
board = teensy41
framework = arduino

; Build flags
; To disable laser safety interlock, add: -DDISABLE_LASER_INTERLOCK
; WARNING: Only use for systems without lasers. Removes safety protection.
;
; BENCH BUILDS: -DTMC_PROBE_REPORT prints each probed slot's driver verdict and
; raw probe word as ASCII on the USB link, at boot and on INITFILTERWHEEL. The
; TMC2240 design's bring-up gate (step 0) needs the raw word from BOTH paths; the
; warm filter-wheel one - an already-configured TMC2660 read at RDSEL = 2 - is
; only reachable at runtime. OFF in the shipping default because the report
; shares the link with the 24-byte status packets: the host accepts any 24-byte
; window ending in a zero byte, so text on the link misaligns its parser and it
; reports a garbage stage position as real - mid-session, and at boot too when
; the host reconnects while the controller is starting (init.cpp explains).
; WARNING: Do not ship an image built with this flag.
;
; BENCH BUILDS: -DBENCH_WHEEL_INJECT adds command 58 (BENCH_INJECT_FOCUS_WHEEL):
; focus-wheel packets scheduled on the controller's clock, so that wheel input
; meeting a commanded Z move can be soaked without a hand on the wheel (the
; panel talks to the controller, not to the PC). Without the flag the command
; number is unassigned. Build with PLATFORMIO_BUILD_FLAGS=-DBENCH_WHEEL_INJECT.
; The same flag adds command 60 (BENCH_PANEL_STREAM): whole panel packets, built
; as the panel builds them and fed to its handler at its 2 ms cadence (wheel,
; joystick, release), and a one-line PN report that counts the real panel's.
; WARNING: Do not ship an image built with this flag.
;
; BENCH BUILDS: -DBENCH_SETTLE_TRACE adds command 59 (BENCH_DUMP_SETTLE_TRACE) and
; the settle trace behind it: for every measured leg of every move-and-settle
; move, what the policy planned, what the window then read and the lost-motion
; model before and after, in a ring of 2048 records (272 KB of RAM2). Nothing is
; printed while moves run; on command 59 the ring goes out as ASCII lines (STH /
; ST / STE, checksummed) between the status packets - which is what misaligns a
; host's parser (TMC_PROBE_REPORT above), so only a bench script asks for it,
; after the run, with the host tool off the port. Without the flag the command
; number is unassigned and the image is the product's, byte for byte. Used
; together: PLATFORMIO_BUILD_FLAGS="-DBENCH_WHEEL_INJECT -DBENCH_SETTLE_TRACE".
; WARNING: Do not ship an image built with this flag.
;
; A non-void function that does not return a value must break the build, not
; warn. tmc4361A_motor_config() shipped for one commit with master's bare
; `return;` left ahead of `return current_ok;`: it returned an indeterminate
; value and the "report an unencodable current" feature was dead. The seam's
; bool results are load-bearing (an unencodable current request has to reach the
; host as CMD_EXECUTION_ERROR), so both shapes of the mistake are errors here.
;
; It takes the flag AND the unflag. -Werror=return-type covers falling off the
; end of a non-void function. It does NOT cover a bare `return;` in one: the
; Teensy platform puts -fpermissive in CXXFLAGS, which files that diagnostic
; under [-fpermissive] rather than [-Wreturn-type], so -Werror=return-type never
; sees it (and -Werror=permissive is not an option GCC accepts). Dropping
; -fpermissive restores it to the hard error it is by default. build_unflags
; rather than a -fno-permissive in build_flags: the latter reaches the C
; compiler too and adds a "valid for C++/ObjC++ but not for C" warning to every
; .c file in the Teensy core (49 of them).
;
; Checked with a clean build of the core: nothing in this project or in the
; framework needed -fpermissive, and the only pre-existing warning, -Wnarrowing
; in TMC4361A.cpp, stays a warning (the platform passes -Wno-error=narrowing).
build_flags =
    -D ARDUINO_TEENSY41
    -I src
    -Werror=return-type

build_unflags =
    -fpermissive

; Exclude test directory from firmware build
build_src_filter =
    +<*>
    -<test/>

; Library dependencies
lib_deps =
    fastled/FastLED@^3.6.0
    bakercp/PacketSerial@^1.4.0

; Upload settings
upload_protocol = teensy-gui

; Monitor settings
monitor_speed = 2000000

; Native test environment (runs on host machine)
; test/test_driver_sequence/stubs holds host shims for <Arduino.h> and <SPI.h>.
; They are on the include path for NATIVE ONLY, so that test_driver_sequence can
; #include tmc2660.cpp / tmc2240.cpp / driver_probe.cpp / stepper_driver.cpp
; directly — the same convention test_crc8 uses for utils/crc8.cpp — and pin
; their register sequences and dispatch on the host. env:teensy41 never sees
; this directory and keeps the real Arduino core; the shared build_src_filter is
; deliberately NOT widened to src/tmc/drivers/*.cpp, because three of those four
; files need Arduino (stepper_driver.cpp is the exception and stays out of the
; filter with them, so that the one test binary owning these stubs owns all
; four).
[env:native]
platform = native
build_flags =
    -I src
    -I test/test_driver_sequence/stubs
    -std=c++11
; Build filter for native tests:
; - Exclude everything by default (-<*>) since most firmware code has Arduino dependencies
; - Include only src/utils/*.cpp which contains pure C++ utilities (e.g., crc8.cpp)
; - Protocol constants are header-only (constants_protocol.h) so no build filter needed
; - If adding new host-testable modules, place them in src/utils/ or add explicit paths here
build_src_filter =
    -<*>
    +<src/utils/*.cpp>
