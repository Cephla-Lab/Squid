name: Firmware Build and Test

on:
  push:
    branches: [master]
    paths:
      - 'firmware/**'
      - '.github/workflows/firmware.yml'
  pull_request:
    paths:
      - 'firmware/**'
      - '.github/workflows/firmware.yml'

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2

      - name: Set up Python
        uses: actions/setup-python@v5.3.0
        with:
          python-version: '3.11'

      - name: Install PlatformIO
        run: pip install platformio

      - name: Build controller firmware (Teensy 4.1)
        run: pio run -e teensy41
        working-directory: ./firmware/controller

      - name: No library may print on the protocol serial port
        # The USB serial port carries the binary host protocol; text from a library's logging
        # (FastLED >= 3.10 does this by default) corrupts the packet stream. The build already
        # refuses a FastLED log level above 0 (src/functions.h); this checks the linked image
        # itself: FastLED's print sink and log pipeline must not be in it. Symbols, not message
        # text - FastLED 3.10.8 dropped the debug message an earlier check grepped for while its
        # error logging stayed linked. A missing image or nm fails too, never a silent pass.
        run: |
          nm="$HOME/.platformio/packages/toolchain-gccarmnoneeabi-teensy/bin/arm-none-eabi-nm"
          elf=.pio/build/teensy41/firmware.elf
          for f in "$nm" "$elf"; do
            if [ ! -f "$f" ]; then
              echo "::error::$f not found"
              exit 1
            fi
          done
          if "$nm" -C "$elf" | grep -E 'fl::(platforms::)?print(ln)?\(|fl::detail::log_emit'; then
            echo "::error::FastLED logging is linked into the firmware - it would print on the protocol serial port"
            exit 1
          fi
        working-directory: ./firmware/controller

      - name: Build joystick firmware (Teensy LC)
        run: pio run -e teensyLC
        working-directory: ./firmware/joystick

      - name: Run unit tests
        run: pio test -e native
        working-directory: ./firmware/controller
