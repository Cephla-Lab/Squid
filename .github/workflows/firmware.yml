name: Firmware Build and Test

on:
  push:
    branches: [master]
    paths:
      - 'firmware/**'
      - '.github/workflows/firmware.yml'
  pull_request:
    paths:
      - 'firmware/**'
      - '.github/workflows/firmware.yml'

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2

      - name: Set up Python
        uses: actions/setup-python@v5.3.0
        with:
          python-version: '3.11'

      - name: Install PlatformIO
        run: pip install platformio

      - name: Build controller firmware (Teensy 4.1)
        run: pio run -e teensy41
        working-directory: ./firmware/controller

      - name: Build controller firmware (Teensy 4.1, new controller profile)
        run: pio run -e teensy41_newctrl
        working-directory: ./firmware/controller

      - name: No library may print on the protocol serial port
        # The USB serial port carries the binary host protocol; text from a library's logging
        # (FastLED >= 3.10 does this by default) corrupts the packet stream. Fail the build if
        # FastLED's log strings are linked into either controller image again. A missing image
        # fails too: `strings` on an absent file finds nothing, which would read as a pass.
        run: |
          for env in teensy41 teensy41_newctrl; do
            elf=.pio/build/$env/firmware.elf
            if [ ! -f "$elf" ]; then
              echo "::error::$elf not found - was the env renamed? Update this list."
              exit 1
            fi
            if strings "$elf" | grep -q "completed channels"; then
              echo "::error::FastLED logging is compiled into the $env firmware (FASTLED_LOG_VERBOSITY must be 0)"
              exit 1
            fi
          done
        working-directory: ./firmware/controller

      - name: Build joystick firmware (Teensy LC)
        run: pio run -e teensyLC
        working-directory: ./firmware/joystick

      - name: Run unit tests
        run: pio test -e native
        working-directory: ./firmware/controller
