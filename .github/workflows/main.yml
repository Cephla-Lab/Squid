name: Install Environment and Run Tests

on:
  push:
    branches: master
  pull_request:
jobs:
  install-and-test:
    permissions:
      contents: read
    runs-on: ubuntu-22.04
    env:
        DISPLAY: ":99.0"
    steps:
      # Our workflows were running out of memory.  We don't need most of the pre-installed machinery in the
      # github ubuntu image, so remove it using this helper action.
      # See: https://github.com/marketplace/actions/free-disk-space-ubuntu
      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true
      - name: Checkout the Squid repo
        uses: actions/checkout@v4
      - name: Run the setup script for Ubuntu 22.04
        run: ./setup_22.04.sh -r=${{ github.workspace }}
        working-directory: ./software
      - name: Run the cuda setup script
        run: ./setup_cuda_22.04.sh
        working-directory: ./software
      - name: "Copy a valid config into the repo software root"
        run: |
          cp configurations/configuration_Squid+.ini .
          # Disable memory profiling in CI to avoid fork+threads deadlock issue
          sed -i '/^\[GENERAL\]/a enable_memory_profiling = false' configuration_Squid+.ini
        working-directory: ./software
      - name: "Populate illumination_channel_config from .example template"
        # The illumination channel config is gitignored but required for
        # default-profile config generation. Other machine_configs templates
        # are intentionally not copied to avoid activating optional hardware
        # paths (e.g., confocal, multi-camera) during tests.
        run: cp machine_configs/illumination_channel_config.yaml.example machine_configs/illumination_channel_config.yaml
        working-directory: ./software
      # For more on the headless qt prep, see here: https://pytest-qt.readthedocs.io/en/latest/troubleshooting.html#github-actions-azure-pipelines-travis-ci-and-gitlab-ci-cd
      - name: "Prep for headless qt tests."
        run: |
          sudo apt install libxkbcommon-x11-0 xvfb libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-xinerama0 libxcb-xfixes0 x11-utils
          /sbin/start-stop-daemon --start --quiet --pidfile /tmp/custom_xvfb_99.pid --make-pidfile --background --exec /usr/bin/Xvfb -- :99 -screen 0 1920x1200x24 -ac +extension GLX
      - name: Run the tests
        # SQUID_PYTEST_HARD_EXIT: belt-and-braces against segfaults during
        # interpreter shutdown AFTER all tests pass (Qt destructor order vs
        # Python GC — the same crash main_hcs.py avoids with os._exit()). The
        # conftest hook hard-exits with pytest's real status once the session
        # is complete, so real test failures still fail the step.
        # Full-application GUI tests are excluded here and run below, one per
        # process: see the comments on those steps.
        run: python3 -m pytest --ignore=tests/control/test_HighContentScreeningGui.py --ignore=tests/control/test_performance_mode.py
        working-directory: ./software
        env:
          SQUID_PYTEST_HARD_EXIT: "1"
      - name: Run the GUI test in its own process
        # Own invocation: the full-application GUI test leaves Qt/thread state
        # behind that deterministically segfaults later Qt tests (e.g.
        # test_channel_sequence) when run in the same pytest process.
        # Step-scoped pyqt6 pin: keeps pytest-qt's qtbot on the same binding as
        # the app code (qtpy, QT_API=pyqt6). Mixed bindings fail with a QObject
        # double-init error, and pointing this at a binding that is not installed
        # (e.g. pyqt5, removed by setup_22.04.sh) aborts pytest at startup.
        run: python3 -m pytest tests/control/test_HighContentScreeningGui.py
        working-directory: ./software
        env:
          QT_API: pyqt6
          PYTEST_QT_API: pyqt6
          SQUID_PYTEST_HARD_EXIT: "1"
      - name: Run the performance-mode GUI test in its own process
        # Also constructs the full HCS GUI. Destroying that GUI segfaults (the
        # destructor-order crash noted above; reproducible by flushing
        # DeferredDelete events right after the test). pytest-qt deleteLater()s
        # the window at teardown, and a later test's event-loop activity flushes
        # that deferred delete — test_squid_laser_engine's cross-thread signal
        # test did, taking the whole pytest process down at 67%. Each full-GUI
        # test file must therefore be the last thing its process does: own
        # step, own process, hard exit.
        run: python3 -m pytest tests/control/test_performance_mode.py
        working-directory: ./software
        env:
          QT_API: pyqt6
          PYTEST_QT_API: pyqt6
          SQUID_PYTEST_HARD_EXIT: "1"
