name: Install Environment and Run Tests

on:
  push:
    branches: master
  pull_request:

# A new push to a PR cancels that PR's run still in progress. Each push to master gets its own group
# (run_id), so every master commit is tested.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  install-and-test:
    permissions:
      contents: read
    runs-on: ubuntu-22.04
    strategy:
      # Let every shard finish, so one run lists all the failures.
      fail-fast: false
      matrix:
        # The main suite split three ways by whole test file (tests/sharding.py), plus the GUI tests
        # that need their own processes.
        part: ["1/3", "2/3", "3/3", "gui"]
    env:
        DISPLAY: ":99.0"
    steps:
      - name: Checkout the Squid repo
        uses: actions/checkout@v4
      - name: Fetch the fluidics library submodule
        # Only this one: control/ndviewer_light stays uninitialized (its own tests do not collect
        # standalone). The setup script pip-installs it --no-deps.
        run: git submodule update --init software/fluidics_v2
      - name: Install the CPU-only PyTorch build
        # basicpy needs torch. Installed first, the CPU build satisfies it, so the setup script does not
        # pull the CUDA build and its ~3 GB of nvidia wheels. No test uses a GPU, so setup_cuda_22.04.sh
        # (CUDA toolkit, cupy) is not run in CI either.
        run: python3 -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Run the setup script for Ubuntu 22.04
        run: ./setup_22.04.sh -r=${{ github.workspace }}
        working-directory: ./software
      - name: "Copy a valid config into the repo software root"
        run: |
          cp configurations/configuration_Squid+.ini .
          # Disable memory profiling in CI to avoid fork+threads deadlock issue
          sed -i '/^\[GENERAL\]/a enable_memory_profiling = false' configuration_Squid+.ini
        working-directory: ./software
      - name: "Populate illumination_channel_config from .example template"
        # The illumination channel config is gitignored but required for
        # default-profile config generation. Other machine_configs templates
        # are intentionally not copied to avoid activating optional hardware
        # paths (e.g., confocal, multi-camera) during tests.
        run: cp machine_configs/illumination_channel_config.yaml.example machine_configs/illumination_channel_config.yaml
        working-directory: ./software
      # For more on the headless qt prep, see here: https://pytest-qt.readthedocs.io/en/latest/troubleshooting.html#github-actions-azure-pipelines-travis-ci-and-gitlab-ci-cd
      - name: "Prep for headless qt tests."
        run: |
          sudo apt install libxkbcommon-x11-0 xvfb libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-xinerama0 libxcb-xfixes0 x11-utils
          /sbin/start-stop-daemon --start --quiet --pidfile /tmp/custom_xvfb_99.pid --make-pidfile --background --exec /usr/bin/Xvfb -- :99 -screen 0 1920x1200x24 -ac +extension GLX
      - name: Install TensorStore for the Zarr v3 writer
        # The setup script does not install it. Without it test_zarr_writer.py is skipped and the
        # NGFF reader check below cannot write its samples. numpy stays below 2, as the setup script pins it.
        run: python3 -m pip install "tensorstore==0.1.78" "numpy<2"
      - name: Run the tests
        # SQUID_PYTEST_HARD_EXIT: belt-and-braces against segfaults during
        # interpreter shutdown AFTER all tests pass (Qt destructor order vs
        # Python GC — the same crash main_hcs.py avoids with os._exit()). The
        # conftest hook hard-exits with pytest's real status once the session
        # is complete, so real test failures still fail the step.
        if: matrix.part != 'gui'
        run: python3 -m pytest --ignore=tests/control/test_HighContentScreeningGui.py --ignore=tests/control/test_objective_swap_gui.py
        working-directory: ./software
        env:
          SQUID_PYTEST_HARD_EXIT: "1"
          SQUID_TEST_SHARD: ${{ matrix.part }}
      - name: Run the GUI test in its own process
        if: matrix.part == 'gui'
        # Own invocation: the full-application GUI test leaves Qt/thread state
        # behind that deterministically segfaults later Qt tests (e.g.
        # test_channel_sequence) when run in the same pytest process.
        # Step-scoped pyqt5 pin: without it, pytest-qt picks PySide6 for qtbot
        # while the app code (qtpy) uses PyQt5, and the mixed bindings fail
        # with a QObject double-init error.
        run: python3 -m pytest tests/control/test_HighContentScreeningGui.py
        working-directory: ./software
        env:
          QT_API: pyqt5
          PYTEST_QT_API: pyqt5
          SQUID_PYTEST_HARD_EXIT: "1"
      - name: Run the objective-swap GUI test in its own process
        if: matrix.part == 'gui'
        # Same isolation as above: it builds the full GUI and spins the event loop, which segfaults
        # when run after the full-application GUI tests in one process.
        run: python3 -m pytest tests/control/test_objective_swap_gui.py
        working-directory: ./software
        env:
          QT_API: pyqt5
          PYTEST_QT_API: pyqt5
          SQUID_PYTEST_HARD_EXIT: "1"
      - name: Open the Zarr output with ngff-zarr and iohub
        if: matrix.part == 'gui'
        # Downstream pipelines read Squid's Zarr output with these libraries. Both need a newer Python
        # than this environment, so uv runs the reader script with its own Python and the versions
        # pinned in the script header. uv, Python and the dependency date are pinned so the step
        # only changes when we change it.
        run: |
          python3 -m tests.ngff_readers.write_samples "$RUNNER_TEMP/zarr_samples"
          python3 -m pip install "uv==0.13.6"
          python3 -m uv run --python 3.12 tests/ngff_readers/read_samples.py "$RUNNER_TEMP/zarr_samples"
        working-directory: ./software
