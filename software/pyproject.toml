[tool.black]
line-length = 120
target-version = ["py34", "py35", "py36", "py38", "py39", "py310", "py311", "py312"]
extend-exclude = '''
(
^/drivers\ and\ libraries/ 
| ^/control/gxipy/ 
| ^/control/RCM_API.py 
| ^/control/TUCam.py 
| ^/control/dcam.py 
| ^/control/dcamapi4.py 
| ^/control/toupcam.py 
| ^/control/toupcam_exceptions.py
| ^/control/ndviewer_light/
| ^/fluidics_v2/
)'''

[tool.pytest.ini_options]
# The two submodules carry their own test suites (and the fluidics one patches time.sleep in its
# conftest); never collect them from software/. The rest is pytest's default list.
norecursedirs = ["fluidics_v2", "ndviewer_light", "*.egg", ".*", "_darcs", "build", "CVS", "dist", "node_modules", "venv", "{arch}"]
