# Z closed loop (firmware >= 1.6). Defaults below = loop off / firmware defaults. Bench-qualified Squid+ Z values
# (2026-09-07): has_encoder_z True, enable_pid_z True, pid_p_z 65535, pid_i_z 0, pid_d_z 0, ramp_profile_z trapezoid,
# max_velocity_z_mm 3.0, max_acceleration_z_mm 300, pid_correction_vmax_z_mm 1.0, pid_max_deviation_z_um 200,
# pid_home_zone_z_um 200, pid_tolerance_z_um 0 (= two encoder counts). Re-qualify with the instrument's objectives.
# pid_p_z: TMC4361A gain, PID_P/256 per second is the loop's rate constant (65535 = 4 ms time constant). Values above
# 65535 (up to 16777215) need firmware >= 1.6 and are meant for the rest-only loop (pid_open_above_z_mm = 0).
pid_p_z = 4096
pid_i_z = 0
pid_d_z = 0
ramp_profile_z = sshape
_ramp_profile_z_options = ["sshape", "trapezoid"]
pid_correction_vmax_z_mm = 0
pid_max_deviation_z_um = 0
pid_home_zone_z_um = 0
pid_tolerance_z_um = 0
# Loop behaviour during moves (firmware >= 1.6): the loop is opened while Z moves faster than this (mm/s) and
# re-engages as it slows. 0 = rest-only (open for every move, engaged at rest; +11 ms per focus step). A value
# >= max_velocity_z_mm keeps the loop engaged throughout (the Squid+ bench qualification: +2-3 ms per move).
# ~1 keeps focus steps closed-loop and opens only long moves: use on a stage whose motor cannot hold VMAX plus
# the correction (the second bench Z stalled at 2.5 mm/s with the loop engaged).
pid_open_above_z_mm = 0
# Commanded Z moves up to this length (um) keep the loop engaged in flight and settle in +2-3 ms (rest-only
# needs +11 ms); longer moves follow pid_open_above_z_mm. The correction's limit cycle needs ~100 ms of motion
# to build, a 100 um step cruises for 23 ms. 0 = off. Measured 2026-09-08 on the Squid+ Z: no worthwhile gain over
# rest-only (2 ms on 1 um steps, none above; single 100 um steps slower) - leave 0.
pid_keep_closed_below_z_um = 0
# Open-loop residual (encoder - counter at rest, um) after counter-increasing / counter-decreasing Z moves, measured
# with z_encoder_pid_tuner.py residual; a rest-only move is aimed past the target by it so the loop has a fraction
# of a micron left to close. 0 = off.
pid_precomp_pos_z_um = 0
pid_precomp_neg_z_um = 0
# Acknowledge a Z move once the counter and, closed-loop, the encoder are within this (um) of the target while the
# ramp finishes; 0 = exact target (closed loop: encoder inside two counts, 0.1 um). Leave 0 for imaging.
completion_window_z_um = 0
scan_stabilization_time_ms_x = 25
scan_stabilization_time_ms_y = 25
scan_stabilization_time_ms_z = 20
homing_enabled_x = True
_homing_enabled_x_options = [True, False]
homing_enabled_y = True
_homing_enabled_y_options = [True, False]
homing_enabled_z = True
# Gap above home where the stage does not follow the actuator (measure with z_encoder_pid_tuner.py zonemap;
# 0 on this stage, 0.64 on the second bench controller). Set [SOFTWARE_POS_LIMIT] z_negative >= gap + 0.1 as the
# floor for every move; homing alone may go below it; z_park_at_min_after_homing brings Z to the floor after a
# homing; keep pid_home_zone_z_um <= the floor so the closed loop engages at the parked position.
z_home_gap_mm = 0
